<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Firebase Test</title>
</head>
<body>
  <h1>Firebase Firestore Bağlantı Testi</h1>
  <button id="btn">Veritabanına Veri Gönder</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIdaSyAf2EX-aA-Q58oKnFlmyKFpbY6GCW5UvMk",
      authDomain: "kirhukukislemler.firebaseapp.com",
      projectId: "kirhukukislemler",
      storageBucket: "kirhukukislemler.firebasestorage.app",
      messagingSenderId: "669057048177",
      appId: "1:669057048177:web:77dd0c1177c1202bdd05d0",
      measurementId: "G-CXX5LMSSYW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("btn").addEventListener("click", async () => {
      try {
        const docRef = await addDoc(collection(db, "test_koleksiyonu"), {
          mesaj: "GitHub uzerinden Firebase testi basarili!",
          tarih: new Date()
        });
        alert("Veri basariyla eklendi! ID: " + docRef.id);
      } catch (e) {
        alert("Hata olustu: " + e.message);
      }
    });
  </script>
</body>
</html>
